[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-install-attribution-governance-pack"
version = "0.1.1.dev1"
description = "Installable SSOT governance pack for Apple and Android mobile install attribution, app campaign attribution, and privacy-preserving app measurement."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
dependencies = [
  "ssot-pack-contracts>=0.2.17,<0.3.0",
  "tomli>=2.0.1; python_version < '3.11'",
]
keywords = [
  "ssot",
  "ssot-registry",
  "ssot-pack-contracts",
  "governance-pack",
  "governance",
  "adr",
  "spec",
  "architecture-decision-records",
  "conformance",
  "compliance",
  "mobile-attribution",
  "install-attribution",
  "adattributionkit",
  "adservices",
  "install-referrer",
  "android",
  "ios",
  "privacy-sandbox",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
  "Environment :: Web Environment",
  "Operating System :: Android",
  "Operating System :: iOS",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/groupsum/mobile-install-attribution-governance-pack"
Repository = "https://github.com/groupsum/mobile-install-attribution-governance-pack"
Issues = "https://github.com/groupsum/mobile-install-attribution-governance-pack/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ssot_pack_mobile_install_attribution" = ["metadata.json"]
"ssot_pack_mobile_install_attribution.templates.adr" = ["*.json", "*.yaml"]
"ssot_pack_mobile_install_attribution.templates.specs" = ["*.json", "*.yaml"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.readme_standards]
policy = "package-guide-v1"
brand = "groupsum"
brand_catalog = "docs/readme-brands.toml"
repository = "https://github.com/groupsum/mobile-install-attribution-governance-pack"
ref = "master"
package_path = "."
layer = "governance"
lifecycle = "active"
license_file = "LICENSE"

[tool.readme_standards.distributions.pypi]
name = "mobile-install-attribution-governance-pack"
published = true

[tool.readme_standards.examples.quick_start]
source = "examples/quick_start.py"
expected_stdout = "examples/quick_start.stdout"
test = ".github/workflows/readme-standards.yml"

[tool.readme_standards.examples.usage]
source = "examples/usage.py"
expected_exit_code = 0
test = ".github/workflows/readme-standards.yml"

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/groupsum/mobile-install-attribution-governance-pack/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "package and example checks"
url = "https://github.com/groupsum/mobile-install-attribution-governance-pack/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/groupsum/mobile-install-attribution-governance-pack/blob/master/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "pack governance"
url = "https://github.com/groupsum/mobile-install-attribution-governance-pack/blob/master/docs/governance/pack-authoring-guide.md"

[tool.readme_standards.statuses.evidence]
label = "README and wheel checks"
url = "https://github.com/groupsum/mobile-install-attribution-governance-pack/actions/workflows/readme-standards.yml"
