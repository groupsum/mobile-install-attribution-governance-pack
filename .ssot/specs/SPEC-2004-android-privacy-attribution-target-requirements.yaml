body: |-
  ## Purpose
  
  Define pack-local requirements for Android privacy-preserving attribution target coverage.
  
  ## Requirements
  
  - Privacy Sandbox on Android Attribution Reporting coverage must govern attribution registration, trigger or conversion reporting, aggregation concepts, platform availability, and status handling.
  - This target must carry explicit status classification: active, deprecated, informational, or out of bounds.
  - Downstream implementation claims must be blocked when platform status is unresolved or unavailable.
  - Deprecated or unavailable platform surfaces must not be represented as stable implementation targets.
  
  ## Evidence Expectations
  
  - Target inventory for Privacy Sandbox on Android Attribution Reporting.
  - Platform-status evidence showing deprecation, availability, or support state.
  - Template review showing status handling and out-of-bounds behavior where applicable.
