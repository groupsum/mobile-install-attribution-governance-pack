body: |-
  ## Context
  
  Google Play Install Referrer provides Android install attribution input through Play Store referral data and timestamps.
  
  ## Decision
  
  This pack includes Google Play Install Referrer API and Google Play Install Referrer Library as the Android install referrer authorities.
  
  These sources govern secure retrieval of install referrer URL, referrer click timestamp, app install timestamp, app version, instant-experience state, client-library connection lifecycle, response handling, retry behavior, and local evidence capture.
  
  ## Authority Sources
  
  - Google Play Install Referrer API.
  - Google Play Install Referrer Library.
