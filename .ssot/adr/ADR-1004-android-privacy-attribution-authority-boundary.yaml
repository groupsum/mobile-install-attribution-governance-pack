body: |-
  ## Context
  
  Privacy Sandbox on Android Attribution Reporting defines privacy-preserving attribution concepts for Android app measurement, but source status can change and may include deprecation risk.
  
  ## Decision
  
  This pack includes Privacy Sandbox on Android Attribution Reporting as an Android privacy attribution target with explicit platform-status handling.
  
  Downstream use must classify the target as active, deprecated, informational, or out of bounds based on current platform status and downstream support. This pack must not present deprecated or unavailable Android attribution surfaces as stable implementation targets.
  
  ## Authority Sources
  
  - Privacy Sandbox on Android Attribution Reporting API.
