body: |-
  ## Context
  
  Apple provides multiple app attribution mechanisms with different surfaces and evidence expectations.
  
  ## Decision
  
  This pack includes Apple AdAttributionKit as the Apple privacy-preserving ad attribution authority for app-install and re-engagement attribution across registered ad platforms. It includes AdAttributionKit attribution rules as the authority for app-side attribution windows and cooldown configuration.
  
  This pack also includes Apple AdServices as a separate authority for Apple Ads attribution token creation and server-side attribution lookup. AdServices attribution payload descriptions govern campaign, ad group, ad, keyword, placement, claim type, and click or view date fields.
  
  ## Authority Sources
  
  - Apple AdAttributionKit.
  - Apple AdAttributionKit attribution rules.
  - Apple AdServices framework.
  - Apple AdServices attribution payload descriptions.
